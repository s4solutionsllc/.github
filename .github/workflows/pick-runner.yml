name: Pick self-hosted runner

# Reusable workflow: picks a self-hosted runner by the org's priority order,
# R2D2 > Kamino-Linux > Coruscant, skipping runners that are offline/busy.
#
# Kamino-Linux is the arm64 Linux VM on Kamino. A caller opts into it with
# `arm64_ok: true` once its job has passed a run on the Kamino-Linux label;
# without that input the order is R2D2 > Coruscant (x64 only).
#
# The pick is made once per calling workflow and every job that uses it
# lands on the picked box, so a box is only picked when it has at least
# `jobs` idle runners. Pass `jobs` = the number of jobs that use the
# output. When no box has room for all of them, the run goes to the x64
# fleet labels so its jobs spread across every x64 box. BB8 was
# retired from CI on 2026-09-28; `bb8_eligible` is kept as a deprecated
# no-op input so existing callers that still pass it don't fail validation.
#
# Outputs:
#   labels       JSON array for `runs-on: ${{ fromJSON(needs.pick.outputs.labels) }}`.
#                Idle box → that box's full label set. Nothing idle (or the
#                fleet's state is unreadable) → the x64 fleet,
#                ["self-hosted","linux","x64"], so the job queues on the first
#                x64 runner to free up and never spends hosted minutes.
#   runner_label Legacy single label (R2D2 or Coruscant only) for callers that
#                still write `[self-hosted, linux, x64, "<label>"]`. Never
#                Kamino-Linux, which is not x64.
#
# These runners are registered at the ORG level (shared via the "Default"
# runner group), so querying their status requires the org-level Actions
# API (`GET /orgs/{org}/actions/runners`). The default GITHUB_TOKEN is
# repo-scoped and cannot call that endpoint, so this workflow needs a PAT
# (classic with `admin:org`, or fine-grained with the org "Self-hosted
# runners: Read-only" permission) passed in as a secret.
#
# One-time setup:
#   1. Create the PAT described above.
#   2. Add it as an ORG secret named ORG_RUNNERS_TOKEN (Settings > Secrets
#      and variables > Actions > New organization secret), with visibility
#      covering whichever repos will call this workflow.
#
# Usage from another repo in this org:
#
#   jobs:
#     pick:
#       uses: s4solutionsllc/.github/.github/workflows/pick-runner.yml@main
#       with:
#         arm64_ok: true
#         jobs: 5
#       secrets:
#         runners_token: ${{ secrets.ORG_RUNNERS_TOKEN }}
#
#     build:
#       needs: pick
#       runs-on: ${{ fromJSON(needs.pick.outputs.labels) }}

on:
  workflow_call:
    inputs:
      arm64_ok:
        description: "Allow the arm64 Kamino-Linux pool (between R2D2 and Coruscant). Set only after the job has passed on Kamino-Linux."
        required: false
        type: boolean
        default: false
      jobs:
        description: "How many of the caller's jobs run on the picked labels. A box is picked only if it has this many idle runners."
        required: false
        type: number
        default: 1
      bb8_eligible:
        description: "Deprecated no-op — BB8 was retired from CI on 2026-09-28"
        required: false
        type: boolean
        default: true
    secrets:
      runners_token:
        description: "PAT with org-level 'Self-hosted runners: Read-only' permission"
        required: true
    outputs:
      labels:
        description: "JSON array of runner labels for runs-on via fromJSON()"
        value: ${{ jobs.pick.outputs.labels }}
      runner_label:
        description: "Legacy: R2D2 or Coruscant, for callers that prefix [self-hosted, linux, x64]"
        value: ${{ jobs.pick.outputs.runner_label }}

jobs:
  pick:
    # Picking a self-hosted box must not itself spend hosted minutes. If
    # every x64 self-hosted runner is busy this job queues too, which is
    # where the caller's job would have queued anyway.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      runner_label: ${{ steps.pick.outputs.label }}
    steps:
      - name: Query runner availability and pick by priority
        id: pick
        uses: actions/github-script@v7
        env:
          ARM64_OK: ${{ inputs.arm64_ok }}
          JOBS: ${{ inputs.jobs }}
        with:
          github-token: ${{ secrets.runners_token }}
          script: |
            const X64 = ['self-hosted', 'linux', 'x64']
            const pools = [
              { name: 'R2D2', labels: [...X64, 'R2D2'], x64: true },
              { name: 'Kamino-Linux', labels: ['self-hosted', 'linux', 'arm64', 'Kamino-Linux'], x64: false },
              { name: 'Coruscant', labels: [...X64, 'Coruscant'], x64: true },
            ].filter(p => p.x64 || process.env.ARM64_OK === 'true')

            const finish = (labels, legacy, why) => {
              core.info(`${why} -> ${JSON.stringify(labels)}`)
              core.setOutput('labels', JSON.stringify(labels))
              core.setOutput('label', legacy)
              return core.summary.addRaw(`Runner pick: ${why} → \`${JSON.stringify(labels)}\``).write()
            }

            let runners
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForOrg({
                org: context.repo.owner,
                per_page: 100,
              })
              runners = data.runners
            } catch (e) {
              return finish(X64, 'R2D2', `runner list unreadable (${e.message}); queuing on the x64 fleet`)
            }

            const norm = (s) => s.toLowerCase()
            const need = Math.max(1, Number(process.env.JOBS) || 1)
            const idle = (name) => runners.filter(r =>
              r.status === 'online' && r.busy === false &&
              r.labels.some(l => norm(l.name) === norm(name))).length

            const pool = pools.find(p => idle(p.name) >= need)
            if (pool) {
              return finish(pool.labels, pool.x64 ? pool.name : 'R2D2',
                `${idle(pool.name)} idle on '${pool.name}' for ${need} job(s)`)
            }
            const counts = pools.map(p => `${p.name}=${idle(p.name)}`).join(', ')
            return finish(X64, 'R2D2', `no box has ${need} idle (${counts}); spreading over the x64 fleet`)
